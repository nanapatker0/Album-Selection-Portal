<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamal & Bindu Wedding</title>
    <!-- Importing exact matching fonts: Great Vibes for cursive, Cinzel for serif -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon: #771724;
            --gold-text: #968469;
            --bg-light: #fdf5ea;
            --bg-dark: #f0e0c8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Desktop par mobile jaisa frame dikhane ke liye */
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
        }

        /* Mobile Screen Container */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            background: linear-gradient(180deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* --- COVER PAGE (Page 1) --- */
        .cover-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            cursor: pointer;
        }

        .cover-page.open {
            transform: translateY(-100%);
        }

        .diamond {
            width: 6px;
            height: 6px;
            background-color: #c5a880;
            transform: rotate(45deg);
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--gold-text);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
        }

        .names-large {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: var(--maroon);
            text-align: center;
            line-height: 1.1;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .names-large .amp-cover {
            font-size: 3.5rem;
            display: block;
            margin: -10px 0;
        }

        .date-minimal {
            font-size: 0.9rem;
            color: var(--gold-text);
            letter-spacing: 5px;
        }

        .please-open {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--gold-text);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: float 2s infinite ease-in-out;
        }

        .arrow-down {
            width: 15px;
            height: 15px;
            border-bottom: 1px solid var(--gold-text);
            border-right: 1px solid var(--gold-text);
            transform: rotate(45deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* --- INNER PAGE (Page 2) --- */
        .inner-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            /* NOTE: Niche di gayi line mein URL ki jagah apni background image ka link daalein */
            background-image: url('https://i.imgur.com/your-floral-background-here.jpg');
            background-size: cover;
            background-position: center;
            background-color: var(--bg-light); /* Fallback color */
            overflow-y: auto;
        }

        .ganesha {
            width: 40px;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .blessings-text {
            font-size: 0.65rem;
            color: var(--gold-text);
            letter-spacing: 2px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .inner-names {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: var(--maroon);
            line-height: 1;
            margin: 15px 0 25px 0;
        }

        .inner-names .amp {
            font-size: 3rem;
        }

        .date-block {
            font-size: 1.1rem;
            color: var(--maroon);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .month-cursive {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: var(--maroon);
            margin: 0 5px;
        }

        .section-title {
            font-size: 0.7rem;
            color: var(--gold-text);
            letter-spacing: 3px;
            margin-top: 15px;
        }

        .venue-text {
            font-size: 0.85rem;
            color: var(--maroon);
            line-height: 1.6;
            margin-top: 10px;
        }

        .diamond-small {
            width: 5px;
            height: 5px;
            background-color: #c5a880;
            transform: rotate(45deg);
            margin: 20px auto;
        }

    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-cocktail-328.mp3" type="audio/mpeg">
    </audio>

    <div class="mobile-container">
        
        <!-- Page 1: Cover Screen -->
        <div class="cover-page" id="cover" onclick="openInvite()">
            <div class="diamond"></div>
            <div class="subtitle">A Wedding Invitation</div>
            
            <div class="names-large">
                Kamal <span class="amp-cover">&</span> Bindu
            </div>

            <div class="date-minimal">10 &middot; 11 &middot; 2026</div>

            <div class="please-open">
                <div class="arrow-down"></div>
                Please Open
            </div>
        </div>

        <!-- Page 2: Inner Card -->
        <div class="inner-page">
            <!-- Ganesha Icon Placeholder -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Ganesha_Om.svg" alt="Om" class="ganesha">

            <div class="blessings-text">
                WITH THE DIVINE BLESSINGS OF OUR FAMILIES<br><br>
                WE CORDIALLY INVITE YOU TO CELEBRATE THE WEDDING<br>OF
            </div>

            <div class="subtitle" style="margin-bottom: 0;">A Wedding Invitation</div>

            <div class="inner-names">
                Kamal<br>
                <span class="amp">&</span> Bindu
            </div>

            <!-- Wedding Date -->
            <div class="date-block">
                10 <span class="month-cursive">Nov</span> | 2026
            </div>

            <!-- Reception Date -->
            <div class="section-title">RECEPTION</div>
            <div class="date-block" style="margin-top: 5px;">
                11 <span class="month-cursive">Nov</span> | 2026
            </div>

            <div class="diamond-small"></div>

            <!-- Venue -->
            <div class="section-title">VENUE</div>
            <div class="venue-text">
                Vedic Village Spa Resort,<br>
                New Town, Kolkata
            </div>
        </div>

    </div>

    <script>
        function openInvite() {
            const cover = document.getElementById('cover');
            const music = document.getElementById('bgMusic');
            
            // Slide the cover up
            cover.classList.add('open');
            
            // Play music
            music.play().catch(e => console.log("Audio requires interaction first: ", e));
        }
    </script>
</body>
</html>
