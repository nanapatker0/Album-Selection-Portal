<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamal & Bindu Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Dark background behind the envelope */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2b1b17 0%, #111 100%);
            z-index: 1;
        }

        /* --- Envelope Styling --- */
        .envelope-container {
            position: relative;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.5s ease;
            text-align: center;
        }
        .envelope-container:hover {
            transform: scale(1.02);
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background: #c59b6d; /* Soft Gold/Brown */
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #e2b989;
            transform-origin: top;
            transition: transform 0.6s ease 0.3s;
            z-index: 3;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #d4a373;
            border-right: 160px solid #d4a373;
            border-bottom: 120px solid #c59b6d;
            border-radius: 0 0 10px 10px;
            z-index: 2;
        }

        .envelope-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .envelope-text span {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .envelope-container.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .envelope-container.open {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.5);
            transition: all 0.6s ease;
        }

        /* --- Traditional Invitation Card Styling --- */
        .invitation-card {
            position: absolute;
            z-index: 5;
            background: radial-gradient(circle at center, #fff5eb 0%, #f9e4d4 100%); /* Soft peach background */
            width: 90%;
            max-width: 450px;
            height: 85vh; /* Taller card to mimic portrait reference */
            max-height: 800px;
            padding: 40px 25px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 2px solid #e0c097;
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow-y: auto;
            color: #5c4033;
        }

        /* Inner decorative border */
        .invitation-card::before {
            content: '';
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            pointer-events: none;
        }

        .invitation-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            z-index: 20;
        }

        .ganesha-icon {
            width: 60px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .small-caps {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #7a6353;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #7a1f3d; /* Traditional Maroon/Wine Red */
            margin: 20px 0;
            line-height: 1.1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #d4af37;
            margin: 20px auto;
            position: relative;
        }
        .divider::after {
            content: '♦';
            position: absolute;
            top: -10px;
            left: 20px;
            color: #d4af37;
            font-size: 14px;
        }

        .event-details {
            font-family: 'Cinzel', serif;
            margin-top: 15px;
        }

        .event-type {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #7a6353;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .event-date {
            font-size: 1.3rem;
            color: #7a1f3d;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .venue-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #7a6353;
            text-transform: uppercase;
        }

        .venue-address {
            font-size: 0.95rem;
            color: #5c4033;
            font-weight: 500;
            line-height: 1.4;
        }

        /* --- Scroll down hint --- */
        .scroll-hint {
            margin-top: 30px;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            color: #a88d78;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-3px); }
        }

        @media(max-width: 400px) {
            .envelope { width: 280px; height: 190px; }
            .envelope-flap { border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #e2b989; }
            .envelope-pocket { border-left: 140px solid #d4a373; border-right: 140px solid #d4a373; border-bottom: 100px solid #c59b6d; }
            .names { font-size: 3rem; }
            .invitation-card { height: 90vh; padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-cocktail-328.mp3" type="audio/mpeg">
    </audio>

    <div class="envelope-container" id="envelopeContainer" onclick="openInvitation()">
        <div class="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-pocket"></div>
            <div class="envelope-text">
                Kamal & Bindu
                <span>Tap to Open</span>
            </div>
        </div>
    </div>

    <div class="invitation-card" id="invitationCard">
